<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myCCTV Remote Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--accent:#00e676;--accent-dim:#00c853;--text:#e0e0e0;--text2:#9e9e9e;--border:#333;--danger:#ff5252;--radius:8px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}

/* Top bar */
.topbar{background:var(--surface);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.1rem;font-weight:600;color:var(--accent);white-space:nowrap}
.topbar .sep{width:1px;height:24px;background:var(--border)}
.conn-group{display:flex;align-items:center;gap:8px;flex:1;min-width:260px}
.conn-group input{flex:1;max-width:320px;padding:7px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9rem;outline:none}
.conn-group input:focus{border-color:var(--accent)}
.btn{padding:7px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-weight:600;transition:background .2s,opacity .2s}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:var(--accent-dim)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:#666;flex-shrink:0}
.dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}
.live-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;position:relative;background:#000;min-height:300px}
.live-panel img{max-width:100%;max-height:calc(100vh - 180px);object-fit:contain;border-radius:4px}
.live-placeholder{color:var(--text2);font-size:1.1rem;text-align:center}
.snap-btn{position:absolute;bottom:20px;right:20px;background:rgba(0,0,0,.6);border:1px solid var(--border);color:#fff;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85rem;backdrop-filter:blur(4px)}
.snap-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Sidebar */
.sidebar{width:300px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ctrl-section{display:flex;flex-direction:column;gap:6px}
.ctrl-section label{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:600}
.ctrl-section select,.ctrl-section input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl-section select{padding:6px 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.85rem;outline:none}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input{flex:1}
.range-row .val{font-size:.8rem;color:var(--text2);min-width:32px;text-align:right}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-row span{font-size:.9rem}
.switch{position:relative;width:42px;height:22px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--surface2);border-radius:22px;border:1px solid var(--border);transition:.2s}
.switch .slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#888;left:2px;top:2px;transition:.2s}
.switch input:checked+.slider{background:var(--accent);border-color:var(--accent)}
.switch input:checked+.slider::before{transform:translateX(20px);background:#000}
.focus-btns{display:flex;gap:6px}
.focus-btns .btn{flex:1;padding:6px 0;font-size:.8rem}
.focus-btns .btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.stream-btns{display:flex;gap:8px}
.stream-btns .btn{flex:1}

/* Status bar */
.statusbar{background:var(--surface);border-top:1px solid var(--border);padding:8px 20px;font-size:.8rem;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap}
.statusbar .rtsp{color:var(--accent);user-select:all}

/* Responsive */
@media(max-width:768px){
  .main{flex-direction:column}
  .sidebar{width:100%;border-left:none;border-top:1px solid var(--border);max-height:50vh}
  .live-panel img{max-height:40vh}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>myCCTV Remote Dashboard</h1>
  <div class="sep"></div>
  <div class="conn-group">
    <input id="ipInput" type="text" placeholder="http://192.168.1.x:41737" value="http://192.168.1.x:41737">
    <button class="btn btn-accent" id="connectBtn" onclick="toggleConnect()">Connect</button>
    <div class="dot" id="connDot"></div>
  </div>
</div>

<div class="main">
  <div class="live-panel">
    <div class="live-placeholder" id="placeholder">Enter phone IP and press Connect</div>
    <img id="liveStream" style="display:none" alt="Live Stream">
    <button class="snap-btn" id="snapBtn" style="display:none" onclick="takeSnapshot()">Snapshot</button>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="ctrl-section">
      <label>Camera</label>
      <select id="cameraSelect" onchange="sendCmd('camera',this.value)"></select>
    </div>
    <div class="ctrl-section">
      <label>Resolution</label>
      <select id="resSelect" onchange="sendCmd('resolution',this.value)"></select>
    </div>
    <div class="ctrl-section">
      <label>FPS</label>
      <select id="fpsSelect" onchange="sendCmd('fps',this.value)"></select>
    </div>
    <div class="ctrl-section">
      <label>Quality</label>
      <div class="range-row">
        <input type="range" id="qualitySlider" min="0" max="100" oninput="document.getElementById('qualityVal').textContent=this.value" onchange="sendCmd('quality',this.value)">
        <span class="val" id="qualityVal">50</span>
      </div>
    </div>
    <div class="ctrl-section">
      <label>Zoom</label>
      <div class="range-row">
        <input type="range" id="zoomSlider" min="1" max="10" step="0.1" oninput="document.getElementById('zoomVal').textContent=parseFloat(this.value).toFixed(1)" onchange="sendCmd('zoom',this.value)">
        <span class="val" id="zoomVal">1.0</span>
      </div>
    </div>
    <div class="ctrl-section">
      <label>Exposure</label>
      <div class="range-row">
        <input type="range" id="exposureSlider" min="-12" max="12" oninput="document.getElementById('exposureVal').textContent=this.value" onchange="sendCmd('exposure',this.value)">
        <span class="val" id="exposureVal">0</span>
      </div>
    </div>
    <div class="ctrl-section">
      <label>Focus Mode</label>
      <div class="focus-btns">
        <button class="btn btn-outline" data-focus="continuous" onclick="setFocus('continuous')">Continuous</button>
        <button class="btn btn-outline" data-focus="auto" onclick="setFocus('auto')">Auto</button>
        <button class="btn btn-outline" data-focus="manual" onclick="setFocus('manual')">Manual</button>
      </div>
    </div>
    <div class="ctrl-section">
      <label>Toggles</label>
      <div class="toggle-row"><span>Torch</span><label class="switch"><input type="checkbox" id="torchToggle" onchange="sendCmd('torch',this.checked)"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Video Overlay</span><label class="switch"><input type="checkbox" id="overlayToggle" onchange="sendCmd('videoOverlay',this.checked)"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Audio</span><label class="switch"><input type="checkbox" id="audioToggle" onchange="sendCmd('audio',this.checked)"><span class="slider"></span></label></div>
    </div>
    <div class="ctrl-section">
      <label>Streaming</label>
      <div class="stream-btns">
        <button class="btn btn-accent" onclick="sendCmd('streaming','true')">Start</button>
        <button class="btn btn-danger" onclick="sendCmd('stopStreaming','true')">Stop</button>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="statusText">Disconnected</span>
  <span id="streamStatus"></span>
  <span id="rtspStatus"></span>
</div>

<script>
let baseUrl='';
let connected=false;
let pollTimer=null;
let suppressSync=false;

function getBase(){
  let v=document.getElementById('ipInput').value.trim();
  if(!/^https?:\/\//.test(v)) v='http://'+v;
  return v.replace(/\/+$/,'');
}

async function toggleConnect(){
  if(connected){disconnect();return}
  baseUrl=getBase();
  try{
    const r=await fetch(baseUrl+'/api/state',{signal:AbortSignal.timeout(5000)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s=await r.json();
    connected=true;
    document.getElementById('connectBtn').textContent='Disconnect';
    document.getElementById('connDot').classList.add('on');
    applyState(s);
    startStream();
    pollTimer=setInterval(pollState,3000);
  }catch(e){
    alert('Connection failed: '+e.message);
  }
}

function disconnect(){
  connected=false;
  clearInterval(pollTimer);
  document.getElementById('connectBtn').textContent='Connect';
  document.getElementById('connDot').classList.remove('on');
  document.getElementById('liveStream').style.display='none';
  document.getElementById('liveStream').src='';
  document.getElementById('placeholder').style.display='';
  document.getElementById('snapBtn').style.display='none';
  document.getElementById('statusText').textContent='Disconnected';
  document.getElementById('streamStatus').textContent='';
  document.getElementById('rtspStatus').textContent='';
}

function startStream(){
  const img=document.getElementById('liveStream');
  img.src=baseUrl+'/video';
  img.style.display='';
  document.getElementById('placeholder').style.display='none';
  document.getElementById('snapBtn').style.display='';
}

async function pollState(){
  if(!connected) return;
  try{
    const r=await fetch(baseUrl+'/api/state',{signal:AbortSignal.timeout(4000)});
    const s=await r.json();
    if(!suppressSync) applyState(s);
  }catch(e){
    document.getElementById('statusText').textContent='Connection lost';
    document.getElementById('connDot').classList.remove('on');
  }
}

function applyState(s){
  populateSelect('cameraSelect',s.cameraOptions,s.selectedCameraKey);
  populateSelect('resSelect',s.resolutionOptions,s.selectedResolution);
  populateSelect('fpsSelect',s.fpsOptions,s.selectedFps);

  setSlider('qualitySlider','qualityVal',s.qualityMin??0,s.qualityMax??100,s.qualityValue??50);
  setSlider('zoomSlider','zoomVal',s.zoomMin??1,s.zoomMax??10,s.zoomValue??1,0.1,1);
  setSlider('exposureSlider','exposureVal',s.exposureMin??-12,s.exposureMax??12,s.exposureValue??0);

  document.getElementById('torchToggle').checked=!!s.torchEnabled;
  document.getElementById('overlayToggle').checked=!!s.videoOverlayEnabled;
  document.getElementById('audioToggle').checked=!!s.audioEnabled;

  document.querySelectorAll('[data-focus]').forEach(b=>{
    b.classList.toggle('active',b.dataset.focus===s.focusMode);
  });

  document.getElementById('statusText').textContent='Connected to '+baseUrl;
  document.getElementById('streamStatus').textContent=s.streaming?'Streaming':'Stopped';
  document.getElementById('rtspStatus').textContent=s.rtspUrl?'RTSP: ':'';
  document.getElementById('rtspStatus').innerHTML=s.rtspUrl?'RTSP: <span class="rtsp">'+s.rtspUrl+'</span>':'';
}

function populateSelect(id,options,selected){
  const el=document.getElementById(id);
  if(!options) return;
  const opts=Array.isArray(options)?options:Object.keys(options);
  const labels=Array.isArray(options)?options:Object.values(options);
  if(el.children.length===opts.length) {
    el.value=selected??'';
    return;
  }
  el.innerHTML='';
  opts.forEach((o,i)=>{
    const opt=document.createElement('option');
    opt.value=o;
    opt.textContent=labels[i];
    el.appendChild(opt);
  });
  if(selected) el.value=selected;
}

function setSlider(sliderId,valId,min,max,value,step,decimals){
  const sl=document.getElementById(sliderId);
  sl.min=min;sl.max=max;
  if(step) sl.step=step;
  sl.value=value;
  document.getElementById(valId).textContent=decimals?parseFloat(value).toFixed(decimals):value;
}

async function sendCmd(param,value){
  if(!connected) return;
  suppressSync=true;
  setTimeout(()=>suppressSync=false,3500);
  try{
    await fetch(baseUrl+'/api/control?'+param+'='+encodeURIComponent(value),{signal:AbortSignal.timeout(4000)});
  }catch(e){console.warn('Control failed:',e)}
}

function setFocus(mode){
  document.querySelectorAll('[data-focus]').forEach(b=>b.classList.toggle('active',b.dataset.focus===mode));
  sendCmd('focus',mode);
}

function takeSnapshot(){
  if(!connected) return;
  const a=document.createElement('a');
  a.href=baseUrl+'/snapshot.jpg';
  a.download='snapshot_'+Date.now()+'.jpg';
  a.target='_blank';
  a.click();
}
</script>
</body>
</html>
